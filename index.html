<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

    <div class="container">

        <!-- HEADER -->

        <h1>Expense Tracker</h1>

        <p class="subtitle">
            Track your daily expenses easily
        </p>


        <!-- SUMMARY -->

        <div class="summary">

            <div class="card">

                <h3>Total Expenses</h3>

                <p>
                    ₹<span id="totalAmount">0</span>
                </p>

            </div>


            <div class="card">

                <h3>Transactions</h3>

                <p id="transactionCount">
                    0
                </p>

            </div>

        </div>


        <!-- ADD EXPENSE -->

        <div class="form-section">

            <h2>Add Expense</h2>


            <input
                type="text"
                id="expenseName"
                placeholder="Expense name"
            >


            <input
                type="number"
                id="expenseAmount"
                placeholder="Amount"
            >


            <select id="expenseCategory" aria-label="Expense category">

                <option value="">
                    Select Category
                </option>

                <option value="Food">
                    Food
                </option>

                <option value="Travel">
                    Travel
                </option>

                <option value="Shopping">
                    Shopping
                </option>

                <option value="Education">
                    Education
                </option>

                <option value="Other">
                    Other
                </option>

            </select>


            <label for="expenseDate">Expense date</label>

            <input type="date"
                id="expenseDate"
            >


            <button onclick="addExpense()">
                Add Expense
            </button>

        </div>


        <!-- EXPENSE HISTORY -->

        <div class="expense-section">

            <h2>Expense History</h2>


            <!-- SEARCH AND FILTER -->

            <div class="filters">

                <input
                    type="text"
                    id="searchExpense"
                    placeholder="Search expense..."
                >


                <select id="filterCategory" aria-label="Filter expenses by category">

                    <option value="All">
                        All Categories
                    </option>

                    <option value="Food">
                        Food
                    </option>

                    <option value="Travel">
                        Travel
                    </option>

                    <option value="Shopping">
                        Shopping
                    </option>

                    <option value="Education">
                        Education
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>


            <!-- EXPENSE LIST -->

            <ul id="expenseList"></ul>

        </div>


        <!-- EXPENSE ANALYSIS -->

        <div class="expense-section">

            <h2>Expense Analysis</h2>

            <canvas id="expenseChart"></canvas>

        </div>

    </div>


    <!-- JAVASCRIPT -->

    <script src="script.js"></script>

</body>

</html>
